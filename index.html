<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#160d08" />
    <meta name="description" content="专注力训练 Pro Android App" />
    <title>专注力训练 Pro</title>
    <style>
        /* 地狱挑战专属样式 */
        #hell-mode-btn { position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #d32f2f; color: #fff; border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-family: sans-serif; font-size: 16px; }
        #hell-game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; color: #fff; overflow-y: auto; font-family: sans-serif; }
        .hell-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .hell-header h2 { margin: 0; font-size: 20px; color: #d32f2f; }
        #close-hell-btn { background: #444; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-size: 14px; }
        .hell-tabs { display: flex; gap: 5px; padding: 10px; overflow-x: auto; border-bottom: 1px solid #333; }
        .hell-tab { padding: 8px 12px; background: #333; color: #fff; border: none; border-radius: 5px; white-space: nowrap; font-size: 14px; }
        .hell-tab.active { background: #d32f2f; }
        #hell-game-container { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .game-wrap { text-align: center; width: 100%; }
        .game-btn { padding: 10px 30px; font-size: 16px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <!-- 你原本的 App 容器 -->
    <div id="app"></div>

    <!-- ================= 地狱级专注力扩展包 开始 ================= -->
    <button id="hell-mode-btn">🔥 地狱挑战</button>

    <div id="hell-game-modal">
        <div class="hell-header">
            <h2>🔥 极限地狱挑战</h2>
            <button id="close-hell-btn">关闭</button>
        </div>
        <div class="hell-tabs">
            <button class="hell-tab active" data-target="game1">记忆</button>
            <button class="hell-tab" data-target="game2">找“末”</button>
            <button class="hell-tab" data-target="game3">算术</button>
            <button class="hell-tab" data-target="game4">舒尔特</button>
        </div>
        <div id="hell-game-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('hell-mode-btn');
            const modal = document.getElementById('hell-game-modal');
            const closeBtn = document.getElementById('close-hell-btn');
            const container = document.getElementById('hell-game-container');
            const tabs = document.querySelectorAll('.hell-tab');

            btn.onclick = () => { modal.style.display = 'flex'; loadGame('game1'); };
            closeBtn.onclick = () => { modal.style.display = 'none'; container.innerHTML = ''; };

            tabs.forEach(tab => {
                tab.onclick = (e) => {
                    tabs.forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    loadGame(e.target.dataset.target);
                };
            });

            function loadGame(type) {
                container.innerHTML = '';
                if (type === 'game1') initMemoryGame(container);
                if (type === 'game2') initFindGame(container);
                if (type === 'game3') initMathGame(container);
                if (type === 'game4') initSchulteGame(container);
            }

            // 游戏1：地狱记忆
            function initMemoryGame(parent) {
                const emojis = ['🐶', '🐕', '🐩', '🐺', '🦊', '🐱', '🐈', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🦆', '🦅', '🦉', '🦇'];
                let score = 0;
                const ui = document.createElement('div'); ui.className = 'game-wrap';
                const title = document.createElement('h3'); title.innerText = '地狱记忆 (1.5秒记忆)';
                const scoreEl = document.createElement('p'); scoreEl.innerText = '得分: ' + score;
                const grid = document.createElement('div'); grid.style.cssText = 'display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px auto; max-width:300px; font-size:40px;';
                const msg = document.createElement('p'); msg.innerText = '准备开始';
                const startBtn = document.createElement('button'); startBtn.innerText = '开始挑战'; startBtn.className = 'game-btn';
                ui.append(title, scoreEl, msg, grid, startBtn); parent.append(ui);

                function play() {
                    grid.innerHTML = ''; startBtn.style.display = 'none'; msg.innerText = '记住这些图案！';
                    let current = [...emojis].sort(() => 0.5 - Math.random()).slice(0, 16);
                    let target = current[Math.floor(Math.random() * current.length)];
                    current.forEach(e => { let d = document.createElement('div'); d.innerText = e; grid.appendChild(d); });
                    
                    setTimeout(() => {
                        grid.innerHTML = ''; msg.innerText = '少了哪一件？';
                        let opts = [target, ...emojis.filter(e => !current.includes(e)).sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
                        opts.forEach(e => {
                            let b = document.createElement('button'); b.innerText = e; b.style.cssText = 'font-size:40px; padding:10px; background:#eee; border:none; border-radius:8px; cursor:pointer;';
                            b.onclick = () => {
                                if (e === target) { score++; scoreEl.innerText = '得分: ' + score; msg.innerText = '✅ 答对！'; }
                                else { score = 0; scoreEl.innerText = '得分: 0'; msg.innerText = '❌ 答错，答案是 ' + target; }
                                grid.innerHTML = ''; setTimeout(play, 1000);
                            };
                            grid.appendChild(b);
                        });
                    }, 1500);
                }
                startBtn.onclick = play;
            }

            // 游戏2：地狱找“末”字
            function initFindGame(parent) {
                const ui = document.createElement('div'); ui.className = 'game-wrap';
                const title = document.createElement('h3'); title.innerText = '找出唯一的“末”';
                const grid = document.createElement('div'); grid.style.cssText = 'display:grid; grid-template-columns:repeat(12,1fr); gap:2px; margin:20px auto; max-width:360px;';
                ui.append(title, grid); parent.append(ui);
                
                let targetIdx;
                function render() {
                    grid.innerHTML = '';
                    const bgChars = ['未', '朱', '来', '术'];
                    targetIdx = Math.floor(Math.random() * 144);
                    for (let i = 0; i < 144; i++) {
                        let b = document.createElement('button');
                        b.innerText = i === targetIdx ? '末' : bgChars[Math.floor(Math.random() * 4)];
                        b.style.cssText = `font-size:12px; padding:2px; transform:rotate(${Math.random()*30-15}deg); color:rgb(${Math.floor(Math.random()*40+30)},${Math.floor(Math.random()*40+30)},${Math.floor(Math.random()*40+30)}); background:transparent; border:none; cursor:pointer;`;
                        b.onclick = () => {
                            if (i === targetIdx) { alert('✅ 找到啦！下一个！'); render(); }
                            else { alert('❌ 找错了！仔细看！'); render(); }
                        };
                        grid.appendChild(b);
                    }
                }
                render();
            }

            // 游戏3：乘法算术找数
            function initMathGame(parent) {
                const ui = document.createElement('div'); ui.className = 'game-wrap';
                const title = document.createElement('h3'); title.innerText = '乘法找数 (1-25)';
                const info = document.createElement('p'); info.innerText = '找数字: 1';
                const grid = document.createElement('div'); grid.style.cssText = 'display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin:20px auto; max-width:320px;';
                const startBtn = document.createElement('button'); startBtn.innerText = '开始挑战'; startBtn.className = 'game-btn';
                ui.append(title, info, grid, startBtn); parent.append(ui);

                let currentNum = 1, cells = [];
                startBtn.onclick = () => {
                    startBtn.style.display = 'none'; grid.innerHTML = ''; currentNum = 1; cells = [];
                    info.innerText = '找数字: 1';
                    for(let i=1; i<=25; i++) {
                        let a = Math.floor(Math.random()*5)+2, b = Math.floor(Math.random()*5)+2;
                        let expr = (a*b <= i) ? (i-(a*b) === 0 ? `${a}×${b}` : `${a}×${b}+${i-(a*b)}`) : `${i}+0`;
                        cells.push({val: i, expr});
                    }
                    cells.sort(() => 0.5 - Math.random());
                    cells.forEach(c => {
                        let b = document.createElement('button'); b.innerText = c.expr; b.style.cssText = 'padding:15px 5px; font-size:14px; cursor:pointer;';
                        b.onclick = () => {
                            if (c.val === currentNum) {
                                if (currentNum === 25) { alert('通关！'); startBtn.style.display = 'block'; grid.innerHTML=''; return; }
                                currentNum++; info.innerText = '找数字: ' + currentNum; b.style.background = '#4caf50'; b.disabled = true;
                            } else { alert('❌ 错了！'); }
                        };
                        grid.appendChild(b);
                    });
                };
            }

            // 游戏4：红黑交替舒尔特
            function initSchulteGame(parent) {
                const ui = document.createElement('div'); ui.className = 'game-wrap';
                const title = document.createElement('h3'); title.innerText = '红黑交替舒尔特';
                const info = document.createElement('p'); info.innerText = '找: 红1'; info.style.color = 'red'; info.style.fontSize = '20px';
                const grid = document.createElement('div'); grid.style.cssText = 'display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin:20px auto; max-width:360px; background:#333; padding:2px;';
                const startBtn = document.createElement('button'); startBtn.innerText = '开始变态挑战'; startBtn.className = 'game-btn';
                ui.append(title, info, grid, startBtn); parent.append(ui);

                let current = 1, isRed = true;
                startBtn.onclick = () => {
                    startBtn.style.display = 'none'; grid.innerHTML = ''; current = 1; isRed = true;
                    info.innerText = '找: 红1'; info.style.color = 'red';
                    let arr = [];
                    for(let i=1; i<=25; i++) arr.push({n:i, c:'red'});
                    for(let i=1; i<=24; i++) arr.push({n:i, c:'black'});
                    arr.sort(() => 0.5 - Math.random());

                    arr.forEach(item => {
                        let b = document.createElement('button'); b.innerText = item.n; b.style.cssText = `aspect-ratio:1; font-size:14px; font-weight:bold; background:#fff; border:none; color:${item.c}; cursor:pointer;`;
                        b.onclick = () => {
                            if (item.n === current && item.c === (isRed ? 'red' : 'black')) {
                                if (current === 25 && item.c === 'red') { alert('通关！太强了！'); startBtn.style.display='block'; grid.innerHTML=''; return; }
                                b.style.background = '#ccc'; b.disabled = true;
                                if (isRed) { isRed = false; info.innerText = '找: 黑' + current; info.style.color = 'black'; }
                                else { isRed = true; current++; info.innerText = '找: 红' + current; info.style.color = 'red'; }
                            } else { alert('❌ 点错了！'); }
                        };
                        grid.appendChild(b);
                    });
                };
            }
        });
    </script>
    <!-- ================= 地狱级专注力扩展包 结束 ================= -->

    <!-- 你原本的 JS 加载代码，千万别删 -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
