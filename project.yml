name: XiaomiBrain
options:
  bundleIdPrefix: com.xiaomi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BrainCore:
    path: BrainCore
targets:
  XiaomiBrain:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: BrainCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 晓米脑力
        CFBundleName: 晓米脑力
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 斯特鲁普训练的语音作答需要用麦克风听你说出的颜色。
        NSSpeechRecognitionUsageDescription: 语音作答需要识别你说出的颜色词，识别尽量在手机本地完成。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaomi.brain
        PRODUCT_NAME: XiaomiBrain
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  XiaomiBrain:
    build:
      targets:
        XiaomiBrain: all
    run:
      config: Debug
    archive:
      config: Release
